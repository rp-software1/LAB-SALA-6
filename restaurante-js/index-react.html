<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta con React</title>
</head>

<body>

    <h1>🍽️ Carta del Restaurante - React</h1>

    <div id="root"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- ReactDOM -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        // ==========================================
        // LOS MISMOS PLATOS DEL index.html
        // ==========================================

        const platos = [
            {
                id: 1,
                nombre: "Lomo saltado",
                categoria: "segundos",
                precio: 18,
                stock: 3,
                disponible: true
            },
            {
                id: 2,
                nombre: "Arroz con pollo",
                categoria: "segundos",
                precio: 12,
                stock: 5,
                disponible: true
            },
            {
                id: 3,
                nombre: "Sopa de verduras",
                categoria: "entradas",
                precio: 8,
                stock: 0,
                disponible: false
            }
        ];


        // ==========================================
        // COMPONENTE CARTA
        // ==========================================

        function Carta({ platos }) {

            return (
                <div>

                    {platos.map((plato) => (

                        <div key={plato.id}>

                            <h2>{plato.nombre}</h2>

                            <p>
                                Categoría: {plato.categoria}
                            </p>

                            <p>
                                Precio: S/ {plato.precio}
                            </p>

                            <p>
                                Stock: {plato.stock}
                            </p>

                            <p>
                                Disponible: {plato.disponible ? "Sí" : "No"}
                            </p>

                            <hr />

                        </div>

                    ))}

                </div>
            );
        }


        // ==========================================
        // CREAR ROOT
        // ==========================================

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );


        // ==========================================
        // RENDERIZAR
        // ==========================================

        root.render(
            <Carta platos={platos} />
        );

    </script>

</body>
</html>
