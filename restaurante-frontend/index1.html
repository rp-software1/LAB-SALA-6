<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante App</title>
</head>

<body style="background-color: #f8f9fa; margin: 0;">

    <div id="root"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        // ==========================================
        // DATOS
        // ==========================================

        const platosMock = [
            { id: 1, nombre: "Lomo saltado", categoria: "segundos", precio: 18, stock: 3, disponible: true },
            { id: 2, nombre: "Arroz con pollo", categoria: "segundos", precio: 12, stock: 5, disponible: true },
            { id: 3, nombre: "Sopa de verduras", categoria: "entradas", precio: 8, stock: 0, disponible: false },
            { id: 4, nombre: "Pollo a la brasa", categoria: "segundos", precio: 20, stock: 4, disponible: true },
            { id: 5, nombre: "Jugo de naranja", categoria: "bebidas", precio: 5, stock: 8, disponible: true }
        ];

        const mesasMock = [
            { id: 1, numero: 1, capacidad: 4, estado: "libre", comensales: 0 },
            { id: 2, numero: 2, capacidad: 2, estado: "ocupada", comensales: 2 },
            { id: 3, numero: 3, capacidad: 6, estado: "reservada", comensales: 0 },
            { id: 4, numero: 4, capacidad: 4, estado: "ocupada", comensales: 3 },
            { id: 5, numero: 5, capacidad: 8, estado: "ocupada", comensales: 0 },
            { id: 6, numero: 6, capacidad: 2, estado: "reservada", comensales: 0 }
        ];

        const cardStyle = {
            padding: "20px 24px",
            margin: "16px 0",
            borderRadius: "12px",
            fontFamily: "system-ui, sans-serif",
            color: "#2d3748",
            boxSizing: "border-box"
        };


        // ==========================================
        // NAVBAR
        // ==========================================

        function NavBar({ nombreRestaurante = "Mi Restaurante" }) {
            return (
                <nav style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    padding: "16px 32px",
                    backgroundColor: "#1a202c",
                    color: "white"
                }}>
                    <h2 style={{ margin: 0 }}>
                        {nombreRestaurante}
                    </h2>

                    <div style={{ display: "flex", gap: "24px" }}>
                        <span>Carta</span>
                        <span>Mesas</span>
                        <span>Comandas</span>
                    </div>
                </nav>
            );
        }


        // ==========================================
        // PLATO CARD
        // ==========================================

        function PlatoCard({ nombre, categoria, precio, stock, disponible }) {
            const backgroundColor = disponible ? "#e0f2e1" : "#ffebee";
            const borderColor = disponible ? "#c8e6c9" : "#ffcdd2";

            return (
                <div style={{
                    ...cardStyle,
                    backgroundColor: backgroundColor,
                    border: `1px solid ${borderColor}`
                }}>
                    <h2>{nombre}</h2>
                    <p><strong>Categoría:</strong> {categoria}</p>
                    <p><strong>Precio:</strong> S/ {precio}</p>
                    <p><strong>Stock:</strong> {stock}</p>
                    <p>{disponible ? "🟢 Disponible" : "🔴 Agotado"}</p>
                </div>
            );
        }


        // ==========================================
        // MESA CARD
        // ==========================================

        function MesaCard({ numero, capacidad, estado, comensales }) {
            let color = "#f5f5f5";
            let texto = "⚪ Desconocido";

            if (estado === "libre") {
                color = "#e0f2e1";
                texto = "🟢 Libre";
            }
            if (estado === "ocupada") {
                color = "#ffebee";
                texto = "🔴 Ocupada";
            }
            if (estado === "reservada") {
                color = "#fff8e1";
                texto = "🟡 Reservada";
            }

            return (
                <div style={{
                    ...cardStyle,
                    backgroundColor: color
                }}>
                    <h2>Mesa #{numero}</h2>
                    <p><strong>Capacidad:</strong> {capacidad} personas</p>
                    <p><strong>Comensales actuales:</strong> {comensales}</p>
                    <p><strong>{texto}</strong></p>
                </div>
            );
        }


        // ==========================================
        // ORDER FORM (Componente Funcional)
        // ==========================================

        function OrderForm({ mesaNumero = 1 }) {
            const [plato, setPlato] = React.useState("");
            const [cantidad, setCantidad] = React.useState(1);
            const [mensaje, setMensaje] = React.useState("");

            function enviarComanda(event) {
                event.preventDefault();

                if (plato === "") {
                    setMensaje("❌ Escribe el nombre del plato");
                    return;
                }

                setMensaje(`✅ Comanda enviada: ${plato} x${cantidad} — Mesa ${mesaNumero}`);
                setPlato("");
                setCantidad(1);
            }

            return (
                <form
                    onSubmit={enviarComanda}
                    style={{
                        backgroundColor: "white",
                        padding: "24px",
                        margin: "20px 0",
                        borderRadius: "12px",
                        boxShadow: "0 2px 8px rgba(0,0,0,0.1)"
                    }}
                >
                    <h2 style={{ margin: "0 0 16px 0" }}>
                        Comanda — Mesa {mesaNumero}
                    </h2>

                    <input
                        type="text"
                        placeholder="Nombre del plato"
                        value={plato}
                        onChange={(event) => setPlato(event.target.value)}
                        style={{
                            width: "100%",
                            padding: "10px",
                            marginBottom: "10px",
                            boxSizing: "border-box",
                            borderRadius: "6px",
                            border: "1px solid #cbd5e0"
                        }}
                    />

                    <input
                        type="number"
                        min="1"
                        value={cantidad}
                        onChange={(event) => setCantidad(Number(event.target.value))}
                        style={{
                            width: "100%",
                            padding: "10px",
                            marginBottom: "10px",
                            boxSizing: "border-box",
                            borderRadius: "6px",
                            border: "1px solid #cbd5e0"
                        }}
                    />

                    <button
                        type="submit"
                        style={{
                            width: "100%",
                            padding: "12px",
                            backgroundColor: "#1a202c",
                            color: "white",
                            border: "none",
                            borderRadius: "6px",
                            cursor: "pointer",
                            fontWeight: "bold"
                        }}
                    >
                        Agregar a comanda
                    </button>

                    {mensaje && (
                        <p style={{
                            color: mensaje.includes("❌") ? "red" : "green",
                            fontWeight: "bold",
                            marginTop: "12px"
                        }}>
                            {mensaje}
                        </p>
                    )}
                </form>
            );
        }


        // ==========================================
        // COMANDAS PAGE (BLOQUE C)
        // ==========================================

        function ComandasPage() {
            // Estado para sincronizar el selector con el OrderForm
            const [mesaSeleccionada, setMesaSeleccionada] = React.useState(1);

            return (
                <div style={{
                    backgroundColor: "#edf2f7",
                    padding: "20px",
                    borderRadius: "12px",
                    marginTop: "20px"
                }}>
                    <h1 style={{ textAlign: "center", margin: "0 0 16px 0" }}>
                        Gestión de Comandas
                    </h1>

                    <div style={{ textAlign: "center", marginBottom: "16px" }}>
                        <label style={{ fontWeight: "bold", marginRight: "10px" }}>
                            Seleccionar Mesa:
                        </label>
                        <select
                            value={mesaSeleccionada}
                            onChange={(e) => setMesaSeleccionada(Number(e.target.value))}
                            style={{
                                padding: "8px 12px",
                                borderRadius: "6px",
                                fontSize: "16px",
                                border: "1px solid #cbd5e0"
                            }}
                        >
                            {mesasMock.map((mesa) => (
                                <option key={mesa.id} value={mesa.numero}>
                                    Mesa #{mesa.numero}
                                </option>
                            ))}
                        </select>
                    </div>

                    {/* El formulario recibe dinámicamente la prop de la mesa seleccionada */}
                    <OrderForm mesaNumero={mesaSeleccionada} />
                </div>
            );
        }


        // ==========================================
        // APP
        // ==========================================

        function App() {
            return (
                <div>
                    <NavBar nombreRestaurante="Sabor & Tradición" />

                    <main style={{
                        maxWidth: "600px",
                        margin: "20px auto",
                        padding: "0 10px"
                    }}>
                        {/* 1. SECCIÓN COMANDAS CON SELECTOR DINÁMICO */}
                        <ComandasPage />

                        <hr style={{ margin: "40px 0", border: "none", borderTop: "2px dashed #cbd5e0" }} />

                        {/* 2. CARTA */}
                        <h1 style={{ textAlign: "center" }}>
                            Carta del Restaurante
                        </h1>

                        {platosMock.map(plato => (
                            <PlatoCard
                                key={plato.id}
                                {...plato}
                            />
                        ))}

                        <hr style={{ margin: "40px 0", border: "none", borderTop: "2px dashed #cbd5e0" }} />

                        {/* 3. MESAS */}
                        <h1 style={{ textAlign: "center" }}>
                            Gestión de Mesas
                        </h1>

                        {mesasMock.map(mesa => (
                            <MesaCard
                                key={mesa.id}
                                {...mesa}
                            />
                        ))}

                    </main>
                </div>
            );
        }


        // ==========================================
        // RENDER
        // ==========================================

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>

</body>

</html>
